name: Pronóstico del SMN
on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # y cuando se pida a mano
permissions:
  contents: write
concurrency: smn
jobs:
  smn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y recortar el pronóstico
        env:
          PUENTE_URL: ${{ secrets.PUENTE_URL }}
        run: python -I herramientas/smn.py
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smn.json
          git diff --cached --quiet || (git commit -m "Pronóstico del SMN" && git push)
